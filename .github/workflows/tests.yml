name: testlar

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bogliqliklarni ornatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testlar
        run: PY=python ./tests/run_all.sh

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yozuvbot_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baza testlari MySQL da
        env:
          TEST_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/yozuvbot_test
        run: python tests/test_db.py
